name: 月次 抽出点検

# 料金ページは予告なく作り替えられる。壊れてもサイト上は「価格が空欄」に
# なるだけでエラーが出ないため、放っておくと静かに劣化していく。
# 毎月1回だけ全ツールを点検し、前回より悪くなったものがあれば Issue で知らせる。
#
# 手元(日本)ではなくCI(米国)で走らせるのが要点。多くのSaaSはアクセス元の国で
# 言語と通貨を変えるので、日本から点検すると本来と違う判定になる。

on:
  schedule:
    # 毎月1日 UTC 08:00（JST 17:00）。日次の巡回(UTC 07:00)とずらして
    # 同じホストへ短時間に二重にアクセスしないようにしている
    - cron: "0 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write   # data/check.json を次回の比較基準として保存する
  issues: write     # 劣化を検出したときに知らせる

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --no-deps -r requirements.txt

      - name: 抽出を点検する
        id: check
        run: |
          set -o pipefail
          # 失敗してもここでジョブを止めない。結果を Issue にする必要がある
          python main.py --check --save-check 2>&1 | tee check-report.txt && ok=1 || ok=0
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          {
            echo "## 抽出点検の結果"
            echo '```'
            cat check-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 次回の比較基準を保存する
        run: |
          set -euo pipefail
          git config user.name  "price-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/check.json
          if git diff --cached --quiet; then
            echo "点検結果に変化なし"
            exit 0
          fi
          git commit -m "chore(check): 抽出状況を記録 $(date -u +%Y-%m)"
          # 日次の巡回ワークフローが同時に価格履歴をコミットしていることがある。
          # どちらも追記だけなので rebase で解決できる。
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push に失敗しました。取り込んで再試行します ($attempt/3)"
            git pull --rebase --autostash
          done
          # 比較基準が1回古いままでも、次回の点検で最新に置き換わるだけなので
          # ジョブは落とさない。
          echo "::warning::比較基準を push できませんでした。次回実行で再記録されます"

      # 問題が無い月は何も通知しない。毎月Issueが立つと読まれなくなり、
      # 本当に壊れた月に気づけなくなる。
      - name: 劣化していたら Issue を立てる
        if: steps.check.outputs.ok == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 日付を入れない。同じ問題を1つのIssueで追い続けるための目印にする
          TITLE: "抽出点検: 対応が必要なツールがあります"
        run: |
          set -euo pipefail
          {
            echo "**$(date -u +%Y-%m-%d) の点検結果**"
            echo ""
            echo "価格を取得できない、または前回より悪化したツールが見つかりました。"
            echo ""
            echo '```'
            cat check-report.txt
            echo '```'
            echo ""
            echo "### 直し方"
            echo ""
            echo "**FETCH** … ページを取得できていません。相手側の遮断や障害で、"
            echo "こちらの設定の問題ではありません。\`patterns\` を書いても直りません。"
            echo "一時的なら放置で回復します（日次の巡回が通れば価格は維持されます）。"
            echo "毎月続くようなら追跡対象から外してください。"
            echo ""
            echo "**NG / PARTIAL** … 取得はできていますが価格を取り出せていません。"
            echo "\`config/tools.yaml\` の該当ツールに \`patterns\` を書きます。"
            echo "金額を捉えるグループを1つだけ含む正規表現です。"
            echo ""
            echo '```yaml'
            echo "    patterns:"
            echo "      Pro: 'name: Pro\\s*\\n\\s*price: \\\$?([\\d.]+)'"
            echo '```'
            echo ""
            echo "直せない場合は、そのプランを \`plans\` から外してください。"
            echo "値が取れないより、誤った値を載せる方が損害が大きいためです。"
            echo ""
            echo "手元で試すときは \`python main.py --check\`（\`--save-check\` は付けない）。"
            echo "ただし日本から実行すると地域差で結果が変わる点に注意してください。"
            echo ""
            echo "_[実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } > issue-body.md

          # 同じ問題で毎月Issueを立てない。開いているものがあれば追記するだけ。
          # 未対応のまま12件並ぶと、どれが新しい問題なのか分からなくなる。
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --state open --label maintenance --search "in:title $TITLE" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file issue-body.md
            echo "既存の Issue #$existing に追記しました"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --label maintenance --body-file issue-body.md
          fi
